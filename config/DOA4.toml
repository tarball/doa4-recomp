[main]
file_path = "../private/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "DOA4_switch_tables.toml"  # generated by tools/boundaries.py from XenonAnalyse output

# Optimizations: CR, CTR, XER, the reservation, and the registers that don't carry arguments or results across calls
# (r0, r2, r11, r12, r14-r31, f0, f14-f31 and most VMX registers) are function locals rather than PPCContext fields,
# so the compiler can keep them in host registers; MSR isn't modeled. LR stays tracked (skip_lr = false): stack walks
# for backtraces read the return addresses functions save, and with non_volatile_as_local the calls to __savegprlr_*
# are dropped except for that store (a XenonRecomp change on our branch). non_argument_as_local needs
# non_volatile_as_local: the __savefpr/__savevmx helpers take their address in r12, a local otherwise.
skip_lr = false
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true
# Functions that exchange registers outside the calling convention (SEH funclets and their parents, functions split
# around jump tables, the save/restore helpers) keep them all in the context: generated by tools/abiscan.py
# (a XenonRecomp option on our branch).
keep_registers_in_context_file_path = "DOA4_keep_registers.toml"
# Every store checks netplay's store map (runtime/ppc_overrides.h, runtime/netplay/page_log.h); runs of stores off one
# base register in straight-line code share one check (a XenonRecomp option on the savestates branch).
group_stores = true

restgprlr_14_address = 0x82A02E10
savegprlr_14_address = 0x82A02DC0
restfpr_14_address = 0x82A03A8C
savefpr_14_address = 0x82A03A40
